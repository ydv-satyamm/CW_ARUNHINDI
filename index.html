<!DOCTYPE html>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ultimate Player - Mobile Optimized</title>

<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>

<style>
body { margin:0; font-family:Arial, sans-serif; background:#0f172a; color:white; overflow-x: hidden; }
header { background:#111827; padding:12px; text-align:center; font-weight: bold; border-bottom: 1px solid #1e293b; }

.container { display:flex; height:calc(100vh - 45px); }

/* Sidebar/Playlist */
.sidebar {
    width:300px;
    background:#020617;
    overflow-y:auto;
    border-right: 1px solid #1e293b;
}
.lesson {
    padding:12px 15px;
    border-bottom:1px solid #1e293b;
    cursor:pointer;
    font-size: 14px;
    transition: 0.2s;
}
.lesson:hover { background:#1e293b; }
.lesson.active { background:#1e293b; border-left: 4px solid #ef4444; color: #ef4444; font-weight: bold; }

/* Main Player Area */
.main { flex:1; position:relative; display: flex; flex-direction: column; background: #000; }

.video-container { position: relative; width: 100%; flex: 1; background: #000; }

video, iframe {
    width:100%;
    height:100%;
    border:none;
}

/* Controls & Buttons */
.controls-bar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 10px 15px;
    background: #0f172a;
    border-top: 1px solid #1e293b;
}

.nav-btn {
    background: #ef4444;
    color: white;
    border: none;
    padding: 8px 16px;
    border-radius: 4px;
    cursor: pointer;
    font-weight: bold;
}

.nav-btn:disabled { background: #334155; cursor: not-allowed; }

/* Overlay UI */
#watermark {
    position:absolute;
    top:20px;
    left:-200px;
    font-size:18px;
    color:red;
    opacity:0.3;
    animation: moveText 35s linear infinite;
    display:none;
    z-index:99;
    pointer-events: none;
}

@keyframes moveText {
    0% { left:-200px; top:10%; }
    50% { left:70%; top:70%; }
    100% { left:-200px; top:10%; }
}

.pdfBtn {
    position:absolute;
    top:10px;
    right:10px;
    background:#ef4444;
    color:white;
    padding:6px 12px;
    border:none;
    border-radius: 4px;
    cursor:pointer;
    z-index:100;
}

#qualitySelect {
    position:absolute;
    top:10px;
    left:10px;
    z-index:100;
    background:rgba(0,0,0,0.6);
    color:white;
    border: 1px solid #334155;
    padding: 2px;
}

/* 📱 MOBILE RESPONSIVE CSS */
@media (max-width: 768px) {
    .container { flex-direction: column; height: auto; }
    
    .video-container { height: 56.25vw; flex: none; } /* 16:9 ratio */
    
    .sidebar { width: 100%; height: 350px; border-right: none; }
    
    header { font-size: 14px; padding: 10px; }
    
    #watermark { font-size: 14px; }
}
</style>
</head>

</div>

// Playlist generate
lessons.forEach((l,i)=>{
    let div=document.createElement("div");
    div.className="lesson";
    div.id = "lesson-" + i;
    div.innerText=l.title;
    div.onclick=()=>loadVideo(i);
    document.getElementById("playlist").appendChild(div);
});

function loadVideo(i){
    currentIndex=i;

    // Highlight active lesson
    document.querySelectorAll('.lesson').forEach(el => el.classList.remove('active'));
    document.getElementById("lesson-" + i).classList.add('active');
    document.getElementById("currentTitle").innerText = lessons[i].title;

    // Navigation buttons state
    document.getElementById("prevBtn").disabled = (i === 0);
    document.getElementById("nextBtn").disabled = (i === lessons.length - 1);

    // Stop old video
    if(hls){ hls.destroy(); }
    video.pause();
    video.removeAttribute("src");
    video.load();
    frame.src = "about:blank";
    frame.style.display = "none";

    let src = lessons[i].video;

    // iframe case (recordedmp4)
    if(src.includes("recordedmp4")){
        video.style.display="none";
        frame.style.display="block";
        frame.src = src;
        watermark.style.display="block";
        return;
    }

    // normal video
    video.style.display="block";

    if(Hls.isSupported()){
        hls = new Hls();
        hls.loadSource(src);
        hls.attachMedia(video);
        hls.on(Hls.Events.MANIFEST_PARSED, function () {
            let select = document.getElementById("qualitySelect");
            select.innerHTML = '<option value="-1">Auto Quality</option>';
            hls.levels.forEach((level, index) => {
                let option = document.createElement("option");
                option.value = index;
                option.text = level.height + "p";
                select.appendChild(option);
            });
            video.play();
        });
    } else {
        video.src = src;
        video.play();
    }
}

function changeVideo(step) {
    let newIndex = currentIndex + step;
    if(newIndex >= 0 && newIndex < lessons.length) {
        loadVideo(newIndex);
        // Scroll to active lesson in sidebar
        document.getElementById("lesson-" + newIndex).scrollIntoView({ behavior: 'smooth', block: 'nearest' });
    }
}

document.getElementById("qualitySelect").onchange = function(){
    if(hls){ hls.currentLevel = this.value; }
};

video.addEventListener("play", ()=> watermark.style.display="block");
video.addEventListener("pause", ()=> watermark.style.display="none");

function openPDF(){
    window.open(lessons[currentIndex].pdf, '_blank');
}

// Initial Load
loadVideo(0);
